workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_NAME: "Toy Manager"
        BUNDLE_ID: "com.example.toymanager"
        APPLE_TEAM_ID: "YOUR_TEAM_ID" # Apple developer ID bo‘lsa shu yerga yoziladi
    scripts:
      - name: Flutter clean
        script: flutter clean
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS release
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - samandarxasanovs770@email.com  # build tayyor bo‘lganda bu emailga yuklab olish linkini yuboradi
